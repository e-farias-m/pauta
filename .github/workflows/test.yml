name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: node build.js
      - name: Run tests
        run: |
          status=0
          node test-score-model.js || status=1
          node test-interactions.js || status=1
          exit $status
